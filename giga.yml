# Gigasail's Go preset supplies fail-closed `go test ./...` coverage and the
# embedded FactMine analyzer. Local policy below adds mutation auditing without
# depending on a source checkout or swallowing producer failures.
version: 1
preset: go

profiles:
  ci:
    producers: [go-test-coverage, slopcop]
    required_evidence: [coverage, sarif]
  # Run on demand with `giga ci --profile mutation`, not as part of review.
  # Gremlins keeps `complete` and `attribution_complete` false until per-test
  # source coverage is exhaustive, and a synchronized profile may not publish
  # partial evidence: it would cache a successful run while the review stayed
  # permanently partial with no work left to schedule. So this profile neither
  # requires the family nor joins the premerge set, and `mutation: false`
  # below keeps it out. Its output is still diagnostic in the Tests view.
  mutation:
    producers: [gremlins-audit]

producers:
  slopcop:
    executor: command
    argv:
      - slopcop
      - report
      - --repo=.
      - --coverage=.giga/artifacts/go-coverage.json
      - --sarif=.giga/artifacts/slopcop.sarif
    needs: [go-test-coverage]
    timeout_seconds: 600
    max_output_bytes: 33554432
    produces:
      - kind: sarif
        format: sarif
        path: .giga/artifacts/slopcop.sarif
        scope: static
        complete: true
        evidence_scope:
          selection: go-production
          test_set: static
  gremlins-audit:
    executor: command
    argv:
      - gremlins
      - --silent
      - unleash
      - .
      - --test-miser-output
      - .giga/artifacts/gremlins-mutant-facts.json
    timeout_seconds: 3600
    max_output_bytes: 33554432
    produces:
      - kind: mutants
        format: mutant-facts
        path: .giga/artifacts/gremlins-mutant-facts.json
        scope: unit
        # Test Miser attribution surfaces directly in Giga's Tests view. It is
        # deliberately not sent through SlopCop, whose input is source coverage.
        # Partial attribution remains diagnostic and never becomes verified.
        complete: false
        evidence_scope:
          selection: full
          mutant_corpus: gremlins-v1
          test_set: unit

review:
  metrics:
    "T3": {policy: deprioritize, weight: 0.0}
  gates:
    - id: uncovered-tier1
      when: {tier: 1, on: added, coverage: uncovered}
      severity: critical
    - id: unverified-hazard
      when: {hazard: any, verified: false}
      severity: critical
  report:
    group_by: tier
    max_findings_per_tier: 25
  tests:
    precommit: {profiles: [ci], mutation: false}
    premerge: {profiles: [ci, analyse], mutation: false}
  checks_enabled: false
  packages:
    root:
      paths: ["**"]
      producers: [go-test-coverage, slopcop]
      premerge: [gremlins-audit]
      checks: [contrib:fmt:go]
