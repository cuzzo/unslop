version: 1
preset: go
producers:
  scip:
    executor: gigasail
    argv: [scip-index, go]
    timeout_seconds: 600
    produces:
      - {kind: auxiliary, format: scip, path: .giga/artifacts/index.scip}
  fact-mine:
    argv: [fact-mine-native, --production, --vcs, git, --scip-index, .giga/artifacts/index.scip]
    needs: [scip]
review:
  metrics:
    "T3": { policy: deprioritize, weight: 0.0 }
  gates:
    - id: uncovered-tier1
      when: { tier: 1, on: added, coverage: uncovered }
      severity: critical
